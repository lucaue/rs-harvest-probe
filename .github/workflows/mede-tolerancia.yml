name: mede-tolerancia
on:
  workflow_dispatch:
jobs:
  medir:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        pausa: ["0.5", "1.5", "3.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: medir tolerancia com pausa ${{ matrix.pausa }}s
        run: python3 mede_tolerancia.py ${{ matrix.pausa }}
