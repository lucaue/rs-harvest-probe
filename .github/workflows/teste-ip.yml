name: teste-ip
on:
  workflow_dispatch:
  push:
jobs:
  sonda:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 3
      matrix:
        n: [1, 2, 3]
    steps:
      - name: sonda
        run: |
          echo "=== runner ${{ matrix.n }} ==="
          IP=$(curl -s --max-time 20 https://api.ipify.org)
          echo "IP de saida: $IP"
          curl -s --max-time 20 "https://ipinfo.io/$IP/org" || true
          SLUG="episode-2-entre-irmaos-69c5dd2160b76d39c70e8e94"
          CODE=$(curl -s -o /tmp/p.html -w "%{http_code}" --max-time 30 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36" \
            -H "Referer: https://www.reelshort.com/" \
            "https://www.reelshort.com/episodes/$SLUG")
          echo "pagina -> http=$CODE bytes=$(wc -c < /tmp/p.html)"
          if grep -q "gokuProps" /tmp/p.html; then echo "RESULTADO: WAF BLOQUEOU";
          elif grep -q "m3u8" /tmp/p.html; then echo "RESULTADO: PASSOU com m3u8";
          else echo "RESULTADO: resposta inesperada"; fi
          echo "--- uma pagina de filme tambem ---"
          C2=$(curl -s -o /tmp/m.html -w "%{http_code}" --max-time 30 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36" \
            -H "Referer: https://www.reelshort.com/" "https://www.reelshort.com/pt/movie/a-cura-do-general-6853c4ccc3007d076909b9c0")
          echo "filme -> http=$C2 bytes=$(wc -c < /tmp/m.html)  tem_gokuProps=$(grep -c gokuProps /tmp/m.html)"
